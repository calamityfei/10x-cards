name: Test & Build Master

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/run-unit-tests

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: ./.github/actions/setup-node

      - name: Build production
        run: npm run build
